<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg4b" cx="50%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#24221F" />
      <stop offset="100%" stop-color="#141311" />
    </radialGradient>
    <linearGradient id="basket4b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFE9DE" />
      <stop offset="100%" stop-color="#D9CEBC" />
    </linearGradient>
    <filter id="shadow4b" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background: Warm Charcoal matching the app dark theme -->
  <rect width="512" height="512" fill="url(#bg4b)" />

  <g filter="url(#shadow4b)">
    <!-- Handle -->
    <path d="M170 232 C170 128, 342 128, 342 232" fill="none" stroke="#C89B6E" stroke-width="22" stroke-linecap="round" />

    <!-- Single crisp sage leaf peeking cleanly -->
    <path d="M188 228 C176 166, 224 142, 260 172 C250 202, 222 224, 188 228 Z" fill="#4CC38A" />
    <path d="M276 226 C284 182, 322 170, 344 194 C332 214, 306 224, 276 226 Z" fill="#2E7D5B" />

    <!-- Basket Body -->
    <path d="M114 236 H398 L370 384 C366 404, 349 418, 329 418 H183 C163 418, 146 404, 142 384 Z" fill="url(#basket4b)" />
    <path d="M116 246 H396 L393 260 H119 Z" fill="#B5A894" opacity="0.32" />

    <!-- Top Rim -->
    <rect x="100" y="218" width="312" height="30" rx="15" fill="#FAF6EE" />
    <circle cx="170" cy="233" r="6.5" fill="#C89B6E" />
    <circle cx="342" cy="233" r="6.5" fill="#C89B6E" />

    <!-- Market Sage Checkmark Seal centered on basket -->
    <circle cx="256" cy="332" r="44" fill="#2E7D5B" />
    <path d="M236 333 L250 347 L278 317" fill="none" stroke="#FAF6EE" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
